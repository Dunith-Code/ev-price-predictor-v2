apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ev-predictor-hpa
  namespace: ev-predictor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ev-predictor-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70